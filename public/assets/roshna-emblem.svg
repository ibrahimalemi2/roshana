<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sapphire Blue Gradients -->
    <linearGradient id="emblemBlueMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8" />
      <stop offset="50%" stop-color="#165BB5" />
      <stop offset="100%" stop-color="#0E3875" />
    </linearGradient>

    <linearGradient id="emblemBlueDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#124082" />
      <stop offset="100%" stop-color="#0A2249" />
    </linearGradient>

    <linearGradient id="emblemBlueHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D8CFF" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Volt Orange / Amber Gradients -->
    <linearGradient id="emblemVoltMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC000" />
      <stop offset="40%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#E55300" />
    </linearGradient>

    <linearGradient id="emblemVoltCore" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>

    <!-- Glow & Shadow -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E2F61" flood-opacity="0.18" />
    </filter>

    <filter id="voltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#emblemShadow)">
    <!-- Blue 'R' Upper Arch & Top Bar -->
    <path d="M 180 110 
             L 320 110 
             C 365 110, 395 135, 395 170 
             C 395 205, 360 230, 320 230 
             L 280 230 
             L 255 270 
             L 205 270 
             L 235 220 
             L 165 220 
             L 200 160 
             L 285 160 
             C 305 160, 320 165, 320 170 
             C 320 175, 305 180, 285 180 
             L 230 180 
             L 210 210 
             L 170 210 
             Z" 
          fill="url(#emblemBlueMain)" />

    <!-- Blue 'R' Left Dynamic Wing / Diagonal Fin -->
    <path d="M 165 220 
             L 245 220 
             L 190 320 
             L 230 320 
             L 155 410 
             L 185 305 
             L 140 305 
             Z" 
          fill="url(#emblemBlueDeep)" />

    <!-- 3D Bevel Highlight Edge on Blue Monogram -->
    <path d="M 180 110 
             L 320 110 
             C 345 110, 370 120, 385 135 
             L 365 150 
             C 350 138, 335 130, 315 130 
             L 190 130 
             Z" 
          fill="url(#emblemBlueHighlight)" opacity="0.85" />

    <!-- Electric Lightning Bolt (Volt Orange / Gold) -->
    <!-- The lightning bolt pierces through the right side shooting upward -->
    <path d="M 285 190 
             L 235 275 
             L 290 275 
             L 240 410 
             L 310 300 
             L 265 300 
             L 325 190 
             Z" 
          fill="url(#emblemVoltMain)" />

    <!-- Ultra-high sharp lightning flare needle shooting high into the sky -->
    <path d="M 270 295 
             L 305 295 
             L 420 85 
             L 330 255 
             L 300 255 
             Z" 
          fill="url(#emblemVoltCore)" />
  </g>
</svg>
